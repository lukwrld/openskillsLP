[build]
  command = "npm run build"

[dev]
  command = "npm run dev"
  port = 3000

[[headers]]
  for = "/hero-frames-cropped/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/menu-palestrantes.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
